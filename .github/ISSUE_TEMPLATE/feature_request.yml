name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      label: Thank you!
      description: |
        Thanks for taking the time to suggest a feature for IVA TIME.
        
        **IvA Time · آیوا تایم**
        Every city. One moment.
  - type: textarea
    id: feature
    attributes:
      label: Feature description
      description: Describe the feature you'd like to see in detail.
      placeholder: |
        As a [type of user], I want [goal] so that [benefit].
        
        Example:
        As a user, I want to add custom cities so that I can track time in locations not currently supported.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be valuable? Who would benefit?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions you've considered?
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (nice to have)
        - Medium (would be helpful)
        - High (important)
        - Critical (blocking)
    validations:
      required: true
  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Screenshots
      description: If applicable, provide mockups or screenshots of the proposed feature.
